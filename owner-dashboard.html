<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow"> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard | Manaal Water</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
<meta name="robots" content="noindex, nofollow">
<style>
  .dash-wrap{ max-width:900px; margin:0 auto; padding:40px 20px 80px; }
  .dash-login{ max-width:380px; margin:80px auto; }
  .order-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .order-top h4{ font-size:1rem; margin-bottom:2px; }
  .order-time{ font-size:.76rem; color:var(--ink-soft); }
  .order-detail{ font-size:.87rem; color:var(--ink-soft); margin:2px 0; }
  .order-detail strong{ color:var(--deep); }
  .status-pill{ font-size:.72rem; font-weight:700; padding:4px 12px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
  .status-Pending{ background:rgba(227,169,62,.18); color:#96700f; }
  .status-Confirmed{ background:rgba(59,130,246,.14); color:#2563eb; }
  .status-Preparing{ background:rgba(139,92,246,.14); color:#7c3aed; }
  .status-Out-for-Delivery{ background:rgba(14,165,233,.14); color:#0284c7; }
  .status-Delivered{ background:rgba(0,194,168,.15); color:#0a8a76; }
  .order-actions{ margin-top:12px; display:flex; gap:10px; }
  .dash-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .maps-link{ font-size:.82rem; }
  .empty-state{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .dash-stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:24px;
}
  .order-body{
  display:grid;
  grid-template-columns:1.35fr .85fr;
  gap:24px;
  margin-top:14px;
}

.order-section{
  min-width:0;
}

.order-side{
  background:rgba(245,250,252,.75);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
}

.order-side-title{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-soft);
  margin-bottom:10px;
  font-weight:700;
}

.customer-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.action-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:38px;
  padding:8px 12px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--deep);
  text-decoration:none;
  font-size:.78rem;
  font-weight:700;
  transition:.2s ease;
}

.action-link:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}

.action-whatsapp{
  border-color:rgba(0,194,168,.35);
}

.action-map{
  border-color:rgba(14,165,233,.35);
}

.order-finance{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.order-total-big{
  font-size:1.18rem;
  font-weight:800;
  color:var(--deep);
}

@media (max-width:720px){
  .order-body{
    grid-template-columns:1fr;
  }
}

.stat-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow-sm);
}

.stat-label{
  font-size:.72rem;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:7px;
}

.stat-value{
  font-size:1.55rem;
  font-weight:800;
  color:var(--deep);
}

.dash-tools{
  display:flex;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.dash-search{
  flex:1;
  min-width:220px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 14px;
  font:inherit;
}

.dash-filter{
  min-width:170px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 14px;
  font:inherit;
}

@media (max-width:800px){
  .dash-stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media (max-width:480px){
  .dash-stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="Manaal Water logo">
      <span class="brand-name">MANAAL <span>WATER</span></span>
    </a>
    <div class="nav-actions">
      <span style="font-size:.8rem; color:var(--ink-soft);">Owner Dashboard</span>
    </div>
  </div>
</nav>

<div class="dash-wrap">

  <div id="dashLoginView" class="form-shell dash-login">
    <h3>Owner Login</h3>
    <p style="margin-bottom:18px; font-size:.88rem;">This page is private — only the Manaal Water owner account can see incoming orders here.</p>
    <div id="dashError" class="badge-note" style="display:none; margin-bottom:16px; border-color:#e0a; color:#a33;"></div>
    <form id="dashLoginForm">
      <div class="field"><label for="dashEmail">Email</label><input id="dashEmail" type="email" required></div>
      <div class="field"><label for="dashPass">Password</label><input id="dashPass" type="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
  </div>

<div id="dashMainView" style="display:none;">

  <div class="dash-header">
    <div>
      <h2 style="margin:0;">Operations Dashboard</h2>
      <p style="margin:5px 0 0; font-size:.85rem; color:var(--ink-soft);">
        Live Manaal Water orders and delivery operations
      </p>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <span id="orderCount" style="font-size:.85rem; color:var(--ink-soft);"></span>
      <button id="dashLogoutBtn" class="btn btn-outline btn-sm">Log out</button>
    </div>
  </div>

  <div class="dash-stats">

    <div class="stat-card">
      <div class="stat-label">Today's Orders</div>
      <div id="statToday" class="stat-value">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div id="statPending" class="stat-value">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">In Progress</div>
      <div id="statProgress" class="stat-value">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Delivered</div>
      <div id="statDelivered" class="stat-value">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Today's Revenue</div>
      <div id="statRevenue" class="stat-value">Rs. 0</div>
    </div>

  </div>

  <div class="dash-tools">

    <input
      id="orderSearch"
      class="dash-search"
      type="search"
      placeholder="Search order no., customer, phone, address..."
      autocomplete="off"
    >

    <select id="statusFilter" class="dash-filter">
      <option value="All">All Statuses</option>
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Preparing">Preparing</option>
      <option value="Out for Delivery">Out for Delivery</option>
      <option value="Delivered">Delivered</option>
    </select>

  </div>

  <div id="ordersList"></div>

</div>

</div>

<!-- Firebase (compat SDK, no build tools needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-init.js"></script>
<script src="assets/dashboard.js"></script>
</body>
</html>
